<!DOCTYPE html>
<html lang="pt-PT" data-theme="light">
<head> 
    <link rel="manifest" href="manifest.json">
    <!-- Suporte a PWA para iOS e Android -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Personagens">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3408/3408506.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arquivo de personagens</title>
<style>
:root{--bg:#EDF0F3;--pn:#fff;--ink:#1A2233;--mu:#5E6A7D;--ln:#D5DBE3;--ac:#2B6F6A;--acx:#fff;--wm:#C77D2E;--r:14px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#12161F;--pn:#1B212D;--ink:#E6EAF1;--mu:#98A3B5;--ln:#2B3342;--ac:#5FBFB4;--acx:#0d1a19}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12161F;--pn:#1B212D;--ink:#E6EAF1;--mu:#98A3B5;--ln:#2B3342;--ac:#5FBFB4;--acx:#0d1a19}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex}
h1,h2,h3,.nm{font-family:"Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif;font-weight:600;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}button.pri{background:var(--ac);color:var(--acx);border-color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px 10px}
textarea{resize:vertical;min-height:90px}
nav{width:210px;flex:none;background:var(--pn);border-right:1px solid var(--ln);padding:18px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
nav h1{font-size:19px;padding:0 10px 14px}
nav a{padding:8px 12px;border-radius:10px;color:var(--mu);text-decoration:none;cursor:pointer;white-space:nowrap}
nav a.on{background:var(--ac);color:var(--acx)}
#col{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;gap:10px;align-items:center;padding:12px 22px;border-bottom:1px solid var(--ln);background:var(--pn)}
header input{max-width:460px}#st{margin-left:auto;color:var(--mu);font-size:13px;white-space:nowrap}
main{padding:22px;overflow:auto;flex:1}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.bar select{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.list .card{flex-direction:row}
.card .im{aspect-ratio:4/3;background:var(--ln) center/cover;display:grid;place-items:center;font:600 40px Georgia,serif;color:var(--mu);cursor:pointer}
.list .card .im{width:110px;aspect-ratio:1;flex:none}
.card .bd{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card p{margin:0;color:var(--mu);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tg{display:inline-block;font-size:12px;padding:1px 9px;border:1px solid var(--ln);border-radius:99px;color:var(--mu);margin:0 4px 4px 0;cursor:pointer}
.act{display:flex;gap:4px;margin-top:auto}.act button{padding:2px 9px}
.fav{color:var(--wm);border:0;background:none;font-size:20px;padding:0}
.hero{display:flex;gap:22px;flex-wrap:wrap;background:var(--pn);border:1px solid var(--ln);border-radius:var(--r);padding:18px}
.pic{width:230px;max-width:100%;aspect-ratio:3/4;border-radius:var(--r);background:var(--ln) center/cover;display:grid;place-items:center;font:600 64px Georgia,serif;color:var(--mu)}
.hi{flex:1;min-width:240px;display:flex;flex-direction:column;gap:8px}
.hi h2{font-size:34px;line-height:1.1}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:18px 0 14px;border-bottom:1px solid var(--ln)}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;white-space:nowrap;color:var(--mu)}
.tabs button.on{color:var(--ink);border-color:var(--ac)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.f span,.kv b{display:block;font-size:13px;color:var(--mu);margin-bottom:2px;font-weight:500}
.kv{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:10px 14px}
.kv p{margin:0;white-space:pre-wrap}
.item{background:var(--pn);border:1px solid var(--ln);border-radius:var(--r);padding:14px;margin-bottom:12px;position:relative}
.item .ctl{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:8px}
.item img,.pv{max-width:100%;max-height:220px;border-radius:10px;display:block;margin:6px 0}
.q{border-left:4px solid var(--ac);font:italic 19px/1.4 Georgia,serif}
.rich{min-height:120px;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px}
.tl{border-left:2px solid var(--ac);padding-left:16px;margin-left:6px}
.tl .item::before{content:"";position:absolute;left:-25px;top:18px;width:10px;height:10px;border-radius:50%;background:var(--ac)}
.rel{display:flex;gap:12px;align-items:center;cursor:pointer}
.av{width:48px;height:48px;border-radius:50%;background:var(--ln) center/cover;flex:none;display:grid;place-items:center;font:600 20px Georgia,serif}
.empty{color:var(--mu);padding:26px;text-align:center;border:1px dashed var(--ln);border-radius:var(--r)}
dialog{border:1px solid var(--ln);border-radius:var(--r);background:var(--pn);color:var(--ink);max-width:380px;width:90%}
dialog .row{display:flex;gap:8px;justify-content:flex-end;flex-direction:row-reverse;margin-top:12px}
svg text{fill:var(--ink);font-size:12px}svg .ed{stroke:var(--mu);stroke-width:1.2}
html,body{overflow-x:hidden}
@media(max-width:780px){
body{flex-direction:column-reverse}
nav{width:100%;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;border-right:0;border-top:1px solid var(--ln);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));position:fixed;bottom:0;left:0;right:0;z-index:99;background:var(--pn);gap:2px}
nav h1{display:none}
nav a{flex:none;padding:9px 12px;min-height:40px;display:flex;align-items:center;font-size:13px}
#col{padding-bottom:calc(58px + env(safe-area-inset-bottom,0px))}
header{flex-wrap:wrap;gap:8px;padding:10px 14px;position:sticky;top:0;z-index:10;padding-top:calc(10px + env(safe-area-inset-top,0px))}
header input{max-width:100%;flex:1 1 100%}
#st{margin-left:0}
main{padding:12px}
.bar{gap:6px}.bar select,.bar button{flex:1 1 auto;min-width:0}
.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.hero{padding:14px;gap:14px;justify-content:center}
.pic{width:170px;margin:0 auto}
.hi{min-width:0;width:100%}
.hi h2{font-size:26px}
.act{justify-content:center}
.list .card{flex-direction:column}
.list .card .im{width:100%;aspect-ratio:16/9}
.g{grid-template-columns:1fr}
input,select,textarea,button{font-size:16px}
button{padding:9px 14px;min-height:40px}
.tg{padding:5px 11px;font-size:13px}
[data-tb]{flex-wrap:wrap;justify-content:flex-start!important}
dialog{width:92%}
}
@media(max-width:400px){nav a{font-size:11.5px;padding:8px 8px}.hi h2{font-size:22px}}
#sheet{display:none}@media print{nav,#col{display:none!important}#sheet{display:block;color:#000;background:#fff;padding:10px}#sheet img{max-width:180px;float:right}#sheet h1{font-size:30px}#sheet h3{border-bottom:1px solid #999;margin-top:16px}#sheet p{white-space:pre-wrap;margin:2px 0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<nav id="nav"></nav><div id="sheet"></div>
<div id="col"><header><input id="q" type="search" placeholder="Pesquisar nome, tags, universo, relações…" aria-label="Pesquisar"><span id="st"></span></header><main id="m"></main></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
// ---------- Armazenamento (trocar por API online mais tarde) ----------
const Store=(()=>{let db;const o=()=>new Promise((ok,ko)=>{if(db)return ok(db);const q=indexedDB.open('personagens',1);q.onupgradeneeded=()=>q.result.createObjectStore('chars',{keyPath:'id'});q.onsuccess=()=>{db=q.result;ok(db)};q.onerror=()=>ko(q.error)});
const tx=(m,f)=>o().then(d=>new Promise((ok,ko)=>{const t=d.transaction('chars',m),r=f(t.objectStore('chars'));t.oncomplete=()=>ok(r.result);t.onerror=()=>ko(t.error)}));
return{all:()=>tx('readonly',s=>s.getAll()),put:c=>tx('readwrite',s=>s.put(c)),del:id=>tx('readwrite',s=>s.delete(id)),clear:()=>tx('readwrite',s=>s.clear())}})();
// ---------- Sincronização na nuvem (Firebase, opcional) ----------
const Cloud=(()=>{
let app=null,auth=null,db=null,unsub=null,user=null,code='',applying=false;
const cfgKey='cloudCfg',codeKey='cloudCode';
const status=()=>{const el=$('#cloudSt');if(el)el.textContent=!app?'Não configurado.':!user?'Configurado. Sem sessão iniciada.':!code?'Sessão iniciada. Sem código de grupo.':'Sincronizado — código: '+code};
function loadCfg(){try{return JSON.parse(localStorage.getItem(cfgKey)||'null')}catch(e){return null}}
function init(cfgObj){try{if(app)firebase.app().delete().catch(()=>{});app=firebase.initializeApp(cfgObj);auth=firebase.auth();db=firebase.firestore();
auth.onAuthStateChanged(u=>{user=u;code=localStorage.getItem(codeKey)||'';if(u&&code)listen();else stopListen();render()});
return true}catch(e){console.error(e);return false}}
function connect(cfgObj){localStorage.setItem(cfgKey,JSON.stringify(cfgObj));return init(cfgObj)}
function login(){if(!auth)return;const p=new firebase.auth.GoogleAuthProvider();auth.signInWithPopup(p).catch(e=>ask('Erro ao iniciar sessão: '+e.message))}
function logout(){if(!auth)return;stopListen();auth.signOut()}
function setCode(c){code=c.trim();localStorage.setItem(codeKey,code);if(user&&code)listen();else stopListen();status()}
function stopListen(){if(unsub){unsub();unsub=null}}
function listen(){stopListen();unsub=db.collection('workspaces').doc(code).collection('chars').onSnapshot(async snap=>{
applying=true;
for(const ch of snap.docChanges()){
if(ch.type==='removed'){S.chars=S.chars.filter(x=>x.id!==ch.doc.id);await Store.del(ch.doc.id)}
else{const n=norm(ch.doc.data());const i=S.chars.findIndex(x=>x.id===n.id);i<0?S.chars.push(n):S.chars[i]=n;await Store.put(n)}
}
applying=false;status();render()
},e=>console.error(e));status()}
async function push(c){if(!user||!code||applying)return;try{await db.collection('workspaces').doc(code).collection('chars').doc(c.id).set(c)}catch(e){console.error(e)}}
async function remove(id){if(!user||!code)return;try{await db.collection('workspaces').doc(code).collection('chars').doc(id).delete()}catch(e){console.error(e)}}
function boot(){const c=loadCfg();if(c)init(c)}
return{boot,connect,login,logout,setCode,push,remove,status,isReady:()=>!!(user&&code),user:()=>user,code:()=>code,active:()=>!!app}})();
// ---------- Modelo ----------
const SEC={
info:[['completo','Nome completo'],['apelidos','Apelidos'],['titulos','Títulos'],['idade','Idade'],['nascimento','Data de nascimento'],['genero','Género'],['pronomes','Pronomes'],['especie','Espécie'],['nacionalidade','Nacionalidade'],['localNasc','Local de nascimento'],['localAtual','Localização atual'],['profissao','Profissão'],['ocupacao','Ocupação'],['estado','Estado atual']],
desc:[['gostos','Gostos','l'],['desgostos','Desgostos','l'],['medos','Medos','l'],['objetivos','Objetivos','l'],['motivacao','Motivação','l'],['fortes','Pontos fortes','l'],['fraquezas','Fraquezas','l'],['poderes','Poderes','l'],['talentos','Talentos','l'],['habitos','Hábitos','l'],['manias','Manias','l'],['segredos','Segredos','l']],
apar:[['altura','Altura'],['peso','Peso'],['olhos','Cor dos olhos'],['cabelo','Cor do cabelo'],['tipoCabelo','Tipo de cabelo'],['pele','Pele'],['corpo','Corpo'],['roupas','Roupas'],['acessorios','Acessórios'],['marcas','Marcas'],['tatuagens','Tatuagens'],['cicatrizes','Cicatrizes'],['especiais','Características especiais'],['livre','Descrição livre da aparência','l']],
pers:[['tipo','Tipo de personalidade'],['alinhamento','Alinhamento'],['ptags','Etiquetas (separadas por vírgula)'],['tracos','Traços','l'],['qualidades','Qualidades','l'],['defeitos','Defeitos','l'],['valores','Valores','l'],['crencas','Crenças','l'],['desejos','Desejos','l'],['frases','Frases típicas','l'],['fala','Forma de falar','l']]};
const LST={
historia:['História / capítulos',[['titulo','Capítulo (ex.: Infância)'],['html','Texto','rich']],'Adicionar capítulo'],
habilidades:['Habilidades',[['nome','Nome'],['categoria','Categoria'],['nivel','Nível'],['descricao','Descrição','l'],['limites','Limitações','l'],['img','Imagem','img']],'Adicionar habilidade'],
timeline:['Linha temporal',[['data','Data ou período'],['titulo','Título'],['descricao','Descrição','l'],['pessoas','Personagens relacionados','chars'],['img','Imagem','img']],'Adicionar evento'],
inventario:['Inventário',[['nome','Nome'],['origem','Origem'],['importancia','Importância'],['descricao','Descrição','l'],['obs','Observações','l'],['img','Imagem','img']],'Adicionar objeto'],
imagens:['Imagens',[['url','Imagem','img'],['legenda','Descrição']],'Adicionar imagem'],
citacoes:['Citações',[['texto','Frase','l'],['contexto','Contexto'],['evento','Evento / capítulo']],'Adicionar citação'],
campos:['Campos personalizados',[['nome','Nome do campo'],['tipo','Tipo','sel'],['valor','Valor','val']],'Adicionar campo']};
const TABS=[['desc','Descrição'],['info','Informações'],['apar','Aparência'],['pers','Personalidade'],['historia','História'],['habilidades','Habilidades'],['rel','Relações'],['timeline','Timeline'],['inventario','Inventário'],['imagens','Imagens'],['citacoes','Citações'],['notas','Notas e campos']];
const TIPOS=[['s','Texto curto'],['l','Texto longo'],['n','Número'],['d','Data'],['list','Lista'],['b','Sim/Não'],['img','Imagem'],['u','URL']];
const REL=['Amigo','Melhor amigo','Inimigo','Rival','Irmão','Irmã','Pai','Mãe','Filho','Filha','Parceiro','Ex-parceiro','Interesse amoroso','Colega','Mentor','Aprendiz','Aliado','Conhecido','Outro'];
const NAV=[['','Dashboard'],['personagens','Personagens'],['favoritos','Favoritos'],['universos','Universos'],['tags','Tags'],['relacoes','Relações'],['timeline','Timeline'],['config','Definições']];
const S={chars:[],q:'',f:{u:'',t:'',s:'rec',v:'grid'},ed:false,tab:'desc',save:'saved',sel:new Set()};
const $=s=>document.querySelector(s),M=$('#m');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const san=h=>{const d=new DOMParser().parseFromString(h||'','text/html');d.querySelectorAll('script,iframe,object,embed,style').forEach(e=>e.remove());d.querySelectorAll('*').forEach(e=>[...e.attributes].forEach(a=>{if(/^on/i.test(a.name)||/^\s*javascript:/i.test(a.value))e.removeAttribute(a.name)}));return d.body.innerHTML};
const byId=id=>S.chars.find(c=>c.id===id),disp=c=>c.conhecido||c.nome||'Sem nome';
const newChar=()=>({id:uid(),nome:'Novo personagem',conhecido:'',titulo:'',descCurta:'',universo:'',projeto:'',tags:[],fav:false,img:'',info:{},desc:{},apar:{},pers:{},historia:[],habilidades:[],relacoes:[],timeline:[],inventario:[],imagens:[],citacoes:[],notas:'',campos:[],criado:Date.now(),atualizado:Date.now()});
const norm=c=>Object.assign(newChar(),c);
const av=(c,cls)=>`<div class="${cls}" style="${c.img?`background-image:url('${esc(c.img)}')`:''}">${c.img?'':esc(disp(c)[0]||'?')}</div>`;
const tagsOf=c=>[...(c.tags||[]),...(c.pers?.ptags||'').split(',').map(x=>x.trim()).filter(Boolean)];
// ---------- Auto-save ----------
let cur=null,timer;
const ind=()=>$('#st').textContent={saved:'Guardado',saving:'A guardar…',dirty:'Alterações não guardadas'}[S.save];
function dirty(c){cur=c;S.save='dirty';ind();clearTimeout(timer);timer=setTimeout(async()=>{S.save='saving';ind();try{c.atualizado=Date.now();await Store.put(c);Cloud.push(c);S.save='saved'}catch(e){S.save='dirty'}ind()},600)}
const saveNow=async c=>{S.save='saving';ind();try{c.atualizado=Date.now();await Store.put(c);Cloud.push(c);S.save='saved'}catch(e){S.save='dirty'}ind()};
function setPath(o,p,v){const k=p.split('.');const l=k.pop();for(const x of k){if(o[x]==null)o[x]={};o=o[x]}o[l]=v}
function getPath(o,p){return p.split('.').reduce((a,x)=>a?.[x],o)}
// ---------- Diálogo ----------
const ask=(msg,val)=>new Promise(r=>{const d=document.createElement('dialog');d.innerHTML=`<form method="dialog"><p>${msg}</p>${val!==undefined?`<input value="${esc(val)}">`:''}<div class="row"><button class="pri" value="1">OK</button><button value="0">Cancelar</button></div></form>`;document.body.append(d);d.showModal();const i=d.querySelector('input');d.onclose=()=>{r(d.returnValue==='1'?(i?i.value:true):null);d.remove()}});
// ---------- Utilitários ----------
const imgData=(file,cb)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(file)};
const dl=(name,data)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=name;a.click()};
function cardHTMLFull(c){const rows=[['Idade',c.info?.idade],['Espécie',c.info?.especie],['Ocupação',c.info?.profissao||c.info?.ocupacao],['Alinhamento',c.pers?.alinhamento]].filter(([,v])=>v);
return `<div id="rpgcard" style="width:600px;padding:34px;background:linear-gradient(160deg,#1b1420,#2a1f33 60%,#1b1420);color:#f3e9d2;font-family:Georgia,'Iowan Old Style',serif;border:6px solid #c9a86a;border-radius:20px;box-sizing:border-box">
<div style="text-align:center;margin-bottom:14px">${c.img?`<img src="${esc(c.img)}" crossorigin="anonymous" style="width:220px;height:220px;object-fit:cover;border-radius:50%;border:4px solid #c9a86a">`:`<div style="width:220px;height:220px;border-radius:50%;border:4px solid #c9a86a;display:flex;align-items:center;justify-content:center;font-size:80px;margin:0 auto;background:#3a2c44">${esc(disp(c)[0]||'?')}</div>`}</div>
<h1 style="text-align:center;font-size:34px;margin:6px 0 2px;letter-spacing:1px">${esc(disp(c))}</h1>
${c.titulo?`<div style="text-align:center;font-style:italic;color:#c9a86a;margin-bottom:10px">${esc(c.titulo)}</div>`:''}
${c.universo?`<div style="text-align:center;font-size:13px;color:#b8aebf;margin-bottom:10px">${esc(c.universo)}${c.projeto?' · '+esc(c.projeto):''}</div>`:''}
<div style="border-top:1px solid #c9a86a66;margin:14px 0"></div>
${c.descCurta?`<p style="font-size:15px;line-height:1.5;text-align:center;margin:0 0 14px">${esc(c.descCurta)}</p>`:''}
${rows.map(([l,v])=>`<div style="display:flex;justify-content:space-between;font-size:14px;padding:5px 2px;border-bottom:1px solid #c9a86a2e"><b>${esc(l)}</b><span>${esc(v)}</span></div>`).join('')}
${(c.tags||[]).length?`<div style="margin-top:14px;text-align:center">${(c.tags||[]).map(t=>`<span style="display:inline-block;border:1px solid #c9a86a;border-radius:99px;padding:3px 11px;font-size:11px;margin:2px">#${esc(t)}</span>`).join('')}</div>`:''}
</div>`}
async function exportCard(c){if(!window.html2canvas){ask('Não foi possível carregar a ferramenta de exportação de imagem (é preciso ligação à internet).');return}
const host=document.createElement('div');host.style.cssText='position:fixed;left:-9999px;top:0';host.innerHTML=cardHTMLFull(c);document.body.append(host);
const imgs=[...host.querySelectorAll('img')];await Promise.all(imgs.map(im=>im.complete?Promise.resolve():new Promise(r=>{im.onload=im.onerror=r})));
try{const canvas=await html2canvas(host.firstElementChild,{backgroundColor:null,scale:2,useCORS:true});
canvas.toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=disp(c)+'-card.png';a.click()})}

// ---------- Eventos ----------
document.addEventListener('click',async e=>{const t=e.target.closest('[data-go],[data-act],[data-tab],[data-tag],[data-cmd]');if(!t)return;const d=t.dataset;
if(d.cmd){e.preventDefault();let a=d.arg;if(d.cmd==='createLink'||d.cmd==='insertImage'){a=await ask(d.cmd==='createLink'?'Endereço do link':'URL da imagem','https://');if(!a)return}document.execCommand(d.cmd,false,a||null);const r=t.parentElement.nextElementSibling;r.dispatchEvent(new Event('input',{bubbles:true}));return}
if(d.go!==undefined)return void(location.hash='#/'+d.go);
if(d.tag){S.f.t=d.tag;location.hash='#/personagens';return render()}
if(d.tab){S.tab=d.tab;return charView(cur.id)}
const c=byId(d.id)||cur,a=d.act;
if(a==='new'){const n=newChar();S.chars.push(n);await saveNow(n);S.ed=true;S.tab='desc';location.hash='#/p/'+n.id}
else if(a==='fav'){c.fav=!c.fav;await saveNow(c);render()}
else if(a==='edit'){S.ed=true;location.hash='#/p/'+c.id;render()}
else if(a==='toggle'){S.ed=!S.ed;if(!c.nome.trim())c.nome='Sem nome';await saveNow(c);charView(c.id)}
else if(a==='dup'){const n=norm(JSON.parse(JSON.stringify(c)));n.id=uid();n.nome+=' (cópia)';n.criado=n.atualizado=Date.now();S.chars.push(n);await saveNow(n);render()}
else if(a==='del'){if(await ask(`Eliminar “${esc(disp(c))}”? Esta ação não pode ser desfeita.`)){S.chars=S.chars.filter(x=>x.id!==c.id);await Store.del(c.id);Cloud.remove(c.id);for(const x of S.chars){const n=(x.relacoes||[]).filter(r=>r.alvo!==c.id);if(n.length!==(x.relacoes||[]).length){x.relacoes=n;await Store.put(x)}}cur=null;location.hash='#/personagens';render()}}
else if(a==='exp')dl(disp(c)+'.json',{versao:1,chars:[c]});
else if(a==='pdf')sheet(c);
else if(a==='card')exportCard(c);
else if(a==='install'){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null}else ask('O teu navegador já não está a oferecer a instalação neste momento, ou a app já está instalada. Em iPhone: usa Partilhar → Adicionar ao ecrã principal.')}
else if(a==='cloudconnect'){const raw=$('#cloudCfgTxt').value;try{const cfg=JSON.parse(raw);if(Cloud.connect(cfg))ask('Firebase configurado.');else ask('Configuração inválida.')}catch(x){ask('JSON inválido. Cola aqui a configuração do Firebase (objeto firebaseConfig).')}}
else if(a==='cloudlogin')Cloud.login();
else if(a==='cloudlogout')Cloud.logout();
else if(a==='cloudsetcode'){const v=$('#cloudCode').value;Cloud.setCode(v);render()}
else if(a==='cloudnewcode'){const v=Math.random().toString(36).slice(2,8).toUpperCase();Cloud.setCode(v);render()}
else if(a==='expsel')dl('selecao.json',{versao:1,chars:S.chars.filter(x=>S.sel.has(x.id))});
else if(a==='expall')dl('personagens-backup.json',{versao:1,chars:S.chars});
else if(a==='view'){S.f.v=S.f.v==='grid'?'list':'grid';render()}
else if(a==='theme'){const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('tema',r.dataset.theme)}catch(x){}}
else if(a==='wipe'){if(await ask('Apagar todos os personagens? Faça primeiro um backup.')){await Store.clear();S.chars=[];render()}}
else if(a==='add'){const k=d.k;cur[k]=cur[k]||[];cur[k].push(k==='relacoes'?{recip:true}:{});dirty(cur);charView(cur.id)}
else if(a==='rm'){cur[d.k].splice(+d.i,1);dirty(cur);charView(cur.id)}
else if(a==='up'||a==='dn'){const l=cur[d.k],i=+d.i,j=a==='up'?i-1:i+1;if(j>=0&&j<l.length){[l[i],l[j]]=[l[j],l[i]];dirty(cur);charView(cur.id)}}
else if(a==='main'){cur.img=cur.imagens[+d.i].url;dirty(cur);charView(cur.id)}
else if(a==='uvis'){S.f.u=d.uni;location.hash='#/personagens'}
else if(a==='uren'){const n=await ask('Novo nome do universo',d.uni);if(n){for(const x of S.chars.filter(x=>x.universo===d.uni)){x.universo=n;await Store.put(x)}render()}}
else if(a==='udel'){if(await ask('Remover este universo? Os personagens ficam sem universo.')){for(const x of S.chars.filter(x=>x.universo===d.uni)){x.universo='';await Store.put(x)}render()}}});
function onEdit(e){const el=e.target;if(el.dataset.sel){el.checked?S.sel.add(el.dataset.sel):S.sel.delete(el.dataset.sel);const b=$('#xs');if(b)b.textContent='Exportar selecionados ('+S.sel.size+')';return}if(el.id==='q'){S.q=el.value;if(location.hash.startsWith('#/p/'))location.hash='#/personagens';else render();return}
if(el.dataset.f){S.f[el.dataset.f]=el.value;return render()}
if(el.dataset.imp!==undefined&&el.files[0]){el.files[0].text().then(async t=>{try{const j=JSON.parse(t);const l=Array.isArray(j)?j:j.chars||[j];for(const x of l){const n=norm(x);if(!n.id)n.id=uid();await Store.put(n);const i=S.chars.findIndex(c=>c.id===n.id);i<0?S.chars.push(n):S.chars[i]=n}await ask(l.length+' personagem(ns) importado(s).');render()}catch(x){ask('Ficheiro inválido.')}});return}
if(el.dataset.up&&el.files[0]){imgData(el.files[0],url=>{setPath(cur,el.dataset.up,url);if(el.dataset.up==='img')cur.img=url;dirty(cur);charView(cur.id)});return}
const p=el.dataset.p;if(!p)return;let v=el.type==='checkbox'?el.checked:el.isContentEditable?el.innerHTML:el.value;if(el.dataset.arr!==undefined)v=v.split(',').map(x=>x.trim()).filter(Boolean);if(el.dataset.multi!==undefined)v=[...el.selectedOptions].map(o=>o.value);
setPath(cur,p,v);dirty(cur);if(el.dataset.rr!==undefined&&e.type==='change')charView(cur.id)}
document.addEventListener('input',onEdit);document.addEventListener('change',e=>{if(e.target.type==='file'||e.target.tagName==='SELECT'||e.target.type==='checkbox')onEdit(e)});
document.addEventListener('mousedown',e=>{if(e.target.closest('[data-cmd]'))e.preventDefault()});
window.addEventListener('hashchange',render);window.addEventListener('beforeunload',()=>{if(S.save!=='saved'&&cur)Store.put(cur)});
// ---------- PWA: instalação e offline ----------
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})})}
// ---------- Arranque ----------
Cloud.boot();
(async()=>{try{const t=localStorage.getItem('tema');if(t)document.documentElement.dataset.theme=t}catch(e){}
try{S.chars=(await Store.all()).map(norm)}catch(e){S.chars=[]}render()})();
</script>
</body>
</html>
